<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神秘读心术</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    /* 基础样式 */
    body, html { 
        width: 100%; height: 100%; 
        font-family: "Microsoft YaHei", sans-serif; 
        background-color: #ffffff; 
        color: #333; 
        overflow: hidden; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
    }

    /* ===== 第一层：背景图片层 ===== */
    #bg-image-layer {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        z-index: 1;
        background-size: contain;
        background-repeat: no-repeat;
        opacity: 0.95;
        
        /* 默认样式（JS 会动态覆盖） */
        background-position: right center; 
        transform: scaleX(-1);
        transition: transform 0.3s ease; 
    }

    /* ===== 第二层：遮罩层 ===== */
    #bg-mask-layer {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        z-index: 2;
        pointer-events: none;
        
        background: linear-gradient(to right, 
            rgba(255, 255, 255, 0.0) 0%,    
            rgba(255, 255, 255, 0.4) 30%,   
            rgba(255, 255, 255, 0.95) 60%,  
            rgba(255, 255, 255, 1) 100%     
        );
    }

    /* ===== 第三层：游戏内容主体 ===== */
    .game-container { 
        width: 900px; 
        height: 600px; 
        position: relative; 
        display: flex; 
        z-index: 10; 
        transform-origin: center center;
        flex-shrink: 0;
    }

    .left-panel { width: 45%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    
    .crystal-ball { 
        width: 220px; height: 220px; border-radius: 50%; 
        background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(100,200,255,0.4) 40%, rgba(0,50,150,0.7) 80%, rgba(0,0,0,0.9)); 
        box-shadow: 0 0 30px rgba(0, 150, 255, 0.6), inset -10px -10px 20px rgba(0,0,0,0.5); 
        cursor: pointer; display: flex; justify-content: center; align-items: center; 
        transition: transform 0.2s, box-shadow 0.2s; position: relative; margin-bottom: 30px; border: 3px solid #6ab5ff; flex-shrink: 0; 
    }
    .crystal-ball:hover { transform: scale(1.05); box-shadow: 0 0 50px rgba(0, 150, 255, 0.9), inset -10px -10px 20px rgba(0,0,0,0.5); }
    #answer-icon { font-size: 100px; color: #ff0; text-shadow: 0 0 20px #ff0; opacity: 0; transition: opacity 0.5s; position: absolute; }
    
    .instructions { 
        font-size: 15px; 
        color: #222; 
        text-shadow: 1px 1px 2px rgba(255,255,255,0.8); 
        padding: 12px; 
        background: rgba(255, 255, 255, 0.6); 
        border-radius: 8px;
        backdrop-filter: blur(2px);
    }
    .instructions p { margin-bottom: 10px; line-height: 1.5; }
    .instructions p:last-child { margin-bottom: 0; color: #d32f2f; font-weight: bold; }

    .right-panel { width: 55%; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr); gap: 2px; padding: 20px; font-size: 16px; font-family: "Courier New", monospace; }
    .grid-item { display: flex; justify-content: flex-end; align-items: center; color: #333; font-weight: bold; }
    .grid-item span.icon { margin-left: 5px; color: #000; font-size: 18px; width: 20px; text-align: center; }

    .vertical-title { position: absolute; right: -60px; top: 50px; writing-mode: vertical-rl; font-size: 40px; font-weight: bold; font-family: "SimSun", serif; color: #1565c0; text-shadow: 1px 1px 0 #fff, 0 0 10px rgba(255,255,255,0.8); letter-spacing: 10px; }

    .right-panel-result { width: 55%; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .result-text { font-size: 32px; font-weight: bold; color: #d32f2f; text-shadow: 1px 1px 2px #fff, 0 0 15px rgba(255,255,255,0.8); text-align: center; }
    .result-text p { margin: 25px 0; }
    
    .btn { padding: 12px 40px; font-size: 20px; font-weight: bold; color: #fff; background: linear-gradient(to bottom, #8b0000, #ff0000, #8b0000); border: 2px solid #ffcccc; border-radius: 25px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2); text-shadow: 1px 1px 2px #000; transition: transform 0.1s; }
    .btn:active { transform: scale(0.95); }
    
    .footer { position: absolute; bottom: 10px; right: 20px; font-size: 12px; color: #1565c0; text-align: right; line-height: 1.4; z-index: 20;}
    .hidden { display: none !important; }

    /* =========================================
       手机端专门适配（竖屏版）
       ========================================= */
    @media (max-width: 768px) {
        /* 允许纵向滚动，取消居中布局 */
        body, html { 
            overflow-y: auto; 
            overflow-x: hidden; 
            display: block; 
        }
        
        /* 手机端图片全屏覆盖，取消镜像（不影响查看） */
        #bg-image-layer { 
            background-size: cover; 
            background-position: center; 
            transform: none !important; 
        }
        
        /* 手机端遮罩改为加厚的白色，保证文字清晰 */
        #bg-mask-layer {
            background: linear-gradient(to bottom, 
                rgba(255, 255, 255, 0.85) 0%, 
                rgba(255, 255, 255, 0.95) 100%);
        }
        
        /* 主容器改为纵向排列 */
        .game-container { 
            width: 100%; 
            height: auto; 
            flex-direction: column; 
            padding: 15px; 
            margin: 0;
        }
        
        /* 竖排标题改为横排放在最上方 */
        .vertical-title {
            position: static;
            writing-mode: horizontal-tb;
            text-align: center;
            font-size: 26px;
            letter-spacing: 4px;
            margin: 10px 0 20px 0;
            order: -1; /* 强制排在最前面 */
        }
        
        /* 左侧面板适应宽度 */
        .left-panel {
            width: 100%;
            padding: 0;
        }
        
        /* 水晶球缩小一点给下面腾出空间 */
        .crystal-ball {
            width: 160px;
            height: 160px;
            margin-bottom: 15px;
        }
        
        #answer-icon { font-size: 70px; }
        
        /* 说明文字紧凑一点 */
        .instructions {
            font-size: 13px;
            margin-bottom: 15px;
            padding: 10px;
        }
        
        /* 核心：数字网格改为 5 列，适合手机屏幕 */
        .right-panel {
            width: 100%;
            grid-template-columns: repeat(5, 1fr); 
            grid-template-rows: auto;
            gap: 4px;
            padding: 10px 0;
            font-size: 14px;
        }
        
        .grid-item {
            justify-content: center; /* 居中更美观 */
            padding: 2px 0;
        }
        
        /* 结果页适配 */
        .right-panel-result {
            width: 100%;
            padding: 20px 0;
        }
        
        .result-text {
            font-size: 22px;
        }
        
        /* 页脚常驻底部 */
        .footer {
            position: static;
            text-align: center;
            margin-top: 20px;
            padding-bottom: 20px;
        }
    }
</style>
</head>
<body>

<div id="bg-image-layer"></div>
<div id="bg-mask-layer"></div>

<div id="game-screen" class="game-container">
    <div class="left-panel">
        <div class="crystal-ball" onclick="revealAnswer()">
            <div id="answer-icon"></div>
        </div>
        <div class="instructions">
            <p>这是一个刑事侦查学古老的神秘读心术，通过识别瞳孔、心率以及体温，它能测算出你内心的感应。百试不爽，非常可怕。准确率＞90%</p>
            <p>在心中从 10~99 之间任意挑选一个数，用这个数先减去它自己的十位数再减去它的个位数，得到最终的数。</p>
            <p>在图表中找出最终数相对应的图形（请往右滑），并把这个图形牢记心中。然后点击水晶球，它将会看穿你的内心！！！</p>
            <p>例如：你选的是 25，25 - 2 - 5 = 最终数 18。（注意，图案在数字右边！）</p>
        </div>
    </div>
    <div class="right-panel" id="number-grid"></div>
    <div class="vertical-title">刑侦神秘读心术</div>
</div>

<div id="result-screen" class="game-container hidden">
    <div class="left-panel">
        <div class="crystal-ball" style="cursor: default; margin-bottom: 20px;">
            <div id="result-icon-display" style="font-size: 120px; color: #ff0; text-shadow: 0 0 30px #ff0, 0 0 60px #ff0000;"></div>
        </div>
        <button class="btn" onclick="resetGame()">再试一次</button>
    </div>
    <div class="right-panel-result">
        <div class="result-text">
            <p>很不可思议吧？</p>
            <p>如果你感觉这只是巧合</p>
            <p>请再试一次......</p>
        </div>
    </div>
    <div class="vertical-title">刑侦神秘读心术</div>
</div>

<div class="footer">
    LD 261107<br>
    <span id="sys-info"></span>
</div>

<script>
    const symbols = ['♈', '♉', '♊', '♋', '♌', '♍', '♎', '♏', '♐', '♑', '♒', '♓'];
    
    const backgrounds = [
        './26110701.png',
        './26110702.png',
        './26110703.png',
        './26110704.png',
        './26110705.png'
    ];

    let targetSymbol = '♈'; 

    document.getElementById('sys-info').innerHTML = 
        `您的操作系统: ${navigator.platform} <br> 您的屏幕分辨率: ${screen.width}X${screen.height}`;

    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function initGame() {
        const randomBg = backgrounds[Math.floor(Math.random() * backgrounds.length)];
        const bgLayer = document.getElementById('bg-image-layer');
        
        bgLayer.style.backgroundImage = `url('${randomBg}')`;

        // 电脑端：处理 03 图片不镜像贴左，其他镜像贴左
        // 手机端：由 CSS 强制接管，居中且不镜像，确保全屏显示
        if (window.innerWidth > 768) {
            if (randomBg.includes('26110703')) {
                bgLayer.style.transform = 'none';
                bgLayer.style.backgroundPosition = 'left center';
            } else {
                bgLayer.style.transform = 'scaleX(-1)';
                bgLayer.style.backgroundPosition = 'right center';
            }
        }

        // 游戏逻辑
        let availableSymbols = shuffle([...symbols]);
        targetSymbol = availableSymbols.pop();

        const grid = document.getElementById('number-grid');
        grid.innerHTML = '';

        for (let i = 99; i >= 0; i--) {
            const div = document.createElement('div');
            div.className = 'grid-item';
            let symbolToUse = (i % 9 === 0) ? targetSymbol : availableSymbols[Math.floor(Math.random() * availableSymbols.length)];
            div.innerHTML = `${i} <span class="icon">${symbolToUse}</span>`;
            grid.appendChild(div);
        }

        const answerIcon = document.getElementById('answer-icon');
        answerIcon.style.opacity = '0';
        answerIcon.textContent = targetSymbol;
    }

    function revealAnswer() {
        document.getElementById('answer-icon').style.opacity = '1';
        setTimeout(() => {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('result-icon-display').textContent = targetSymbol;
            
            // 手机端切换后滚动回顶部
            if (window.innerWidth <= 768) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }, 1000);
    }

    function resetGame() {
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        initGame();
        
        // 手机端重试时滚动回顶部
        if (window.innerWidth <= 768) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    // 确保窗口大小改变时背景逻辑更新
    window.addEventListener('resize', () => {
        const bgLayer = document.getElementById('bg-image-layer');
        if (window.innerWidth <= 768) {
            // 手机端样式重置为 CSS 控制
            bgLayer.style.transform = '';
            bgLayer.style.backgroundPosition = '';
        } else {
            // 电脑端重新计算
            const bgUrl = bgLayer.style.backgroundImage;
            if (bgUrl.includes('26110703')) {
                bgLayer.style.transform = 'none';
                bgLayer.style.backgroundPosition = 'left center';
            } else {
                bgLayer.style.transform = 'scaleX(-1)';
                bgLayer.style.backgroundPosition = 'right center';
            }
        }
    });

    window.onload = initGame;
</script>
</body>
</html>
